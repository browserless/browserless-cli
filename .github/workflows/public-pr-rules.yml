name: Public PR rules

# PR titles, descriptions and commit messages must not contain internal ticket
# IDs or links to internal tools. Runs once the repository is public; set the
# repository variable ENFORCE_PUBLIC_PR_RULES to `true` to run it while private.
on:
  pull_request:
    types: [opened, edited, synchronize, reopened]

permissions: {}

jobs:
  check:
    name: Public PR rules
    if: ${{ !github.event.repository.private || vars.ENFORCE_PUBLIC_PR_RULES == 'true' }}
    runs-on: ubuntu-slim
    timeout-minutes: 5
    permissions:
      contents: read
    steps:
      - uses: actions/checkout@v7.0.1
        with:
          # Full history, so the base..head commit range is available.
          fetch-depth: 0
          persist-credentials: false
      - uses: actions/setup-node@v7.1.0
        with:
          node-version-file: .nvmrc
          package-manager-cache: false
      - name: Check PR title, description and commit messages
        env:
          PR_TITLE: ${{ github.event.pull_request.title }}
          PR_BODY: ${{ github.event.pull_request.body }}
          PR_AUTHOR: ${{ github.event.pull_request.user.login }}
          BASE_SHA: ${{ github.event.pull_request.base.sha }}
          HEAD_SHA: ${{ github.event.pull_request.head.sha }}
        run: node scripts/ci/check-public-pr-text.mjs
