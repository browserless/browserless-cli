name: Smoke macOS

# Manual-dispatch smoke test on a real macOS runner. Covers macOS-only
# integration paths that unit tests can't:
#   - npm bin shim resolution on PATH
#   - Real Chrome detection at ~/Library/Application Support/Google/Chrome
#   - SingletonLock as a symlink (vs. regular file on Windows)
#   - SIGTERM → SIGKILL grace path (no taskkill)
#   - Keychain Safe Storage availability for @napi-rs/keyring
#   - File mode 0o600 enforcement on the config dir
#
# Trigger: Actions → Smoke macOS → Run workflow.

on:
  workflow_dispatch:

permissions:
  contents: read

jobs:
  smoke:
    runs-on: macos-latest
    timeout-minutes: 15
    # Dogfooding the CLI must never emit usage analytics to production.
    env:
      BROWSERLESS_TELEMETRY_DISABLED: '1'
    steps:
      - uses: actions/checkout@v7.0.1
        with:
          persist-credentials: false

      - name: Set up Node 26
        uses: actions/setup-node@v7.1.0
        with:
          node-version-file: .nvmrc
          cache: npm
          check-latest: true
      - name: Ensure npm >= 11.10.0 (min-release-age support)
        # Use the bundled npm (check-latest keeps it current); never install another CLI.
        shell: bash
        run: |
          node -e 'const [major, minor] = process.argv[1].split(".").map(Number); if (!(major > 11 || (major === 11 && minor >= 10))) process.exit(1)' "$(npm --version)"

      - name: Install dependencies
        run: npm ci

      - name: Build
        run: npm run build

      - name: Link CLI globally
        run: npm link

      - name: Verify CLI binary resolves on PATH
        run: |
          which browserless
          browserless --version
          browserless --help

      - name: Help tree across all namespaces
        run: |
          browserless profile --help
          browserless auth --help
          browserless config --help
          browserless profile sources --help
          browserless profile exclude --help

      - name: Local-only commands (config + exclude round-trips)
        run: bash scripts/smoke/local-commands.sh

      - name: Verify config file mode is 0600 (POSIX-only assertion)
        run: |
          mode=$(stat -f "%Lp" "$HOME/.browserless/config.json")
          [ "$mode" = "600" ] || { echo "config.json mode is $mode, expected 600"; exit 1; }
          echo "✓ config.json mode is 600"

      - name: Verify pre-installed Chrome (macos-latest ships it)
        run: bash scripts/smoke/verify-chrome.sh
        env:
          RUNNER_OS: macOS

      - name: Seed Chrome user-data-dir for discovery
        # Skip launching Chrome to "initialize" — on macOS runners Chrome's
        # first-run XPC / Helper chatter can take >10s and our kill races
        # the directory write. Write the bare minimum directly so
        # discovery passes. The real `profile launch` step below still
        # exercises end-to-end Chrome boot.
        run: |
          set -e
          dir="$HOME/Library/Application Support/Google/Chrome"
          mkdir -p "$dir/Default"
          echo '{}' > "$dir/Default/Preferences"
          echo '{"profile":{"info_cache":{"Default":{"name":"Test"}}}}' > "$dir/Local State"
          echo "✓ Seeded $dir/Default"

      - name: Discovery — text + JSON, must include chrome
        run: bash scripts/smoke/discovery.sh
        env:
          RUNNER_OS: macOS

      - name: Smoke profile launch (--headless --json, verify CDP endpoint)
        timeout-minutes: 3
        run: bash scripts/smoke/profile-launch.sh
        env:
          RUNNER_OS: macOS

      - name: Smoke profile launch — lock detection (Chrome already running)
        timeout-minutes: 2
        run: bash scripts/smoke/lock-detection.sh
        env:
          RUNNER_OS: macOS

      - name: Run unit tests on macOS
        run: npm test
        env:
          CI: 'true'
