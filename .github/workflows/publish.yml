name: Publish

# Builds, tests and packs the release in a job with no publishing identity, then
# publishes that same-run tarball from a separate job that holds the npm OIDC token
# and runs no package lifecycle scripts.

on:
  push:
    tags:
      - 'v*.*.*'
  # Manual recovery path. `publish.yml` normally fires on the tag-push event that
  # release-please emits when a release PR merges — but that event can be dropped
  # (e.g. a GitHub Actions incident stalls the release job, the tag is created late,
  # and its push event never reaches Actions), leaving a tag + GitHub Release with
  # nothing published to npm. Re-pushing the tag is the alternative, but it churns the
  # release; dispatching this against the existing tag republishes without touching it.
  #
  # Dispatch from the default branch (that is where this trigger lives) and pass the tag
  # to publish; the jobs below check out that tag, so they build and publish exactly
  # that release, not the branch it was dispatched from.
  workflow_dispatch:
    inputs:
      tag:
        description: 'Existing release tag to publish, e.g. v0.3.0'
        required: true
        type: string

# Serialize publishes per-tag — two rapid tag pushes to the same ref
# would otherwise race two `npm publish` jobs, with the loser failing
# 403 (already published). cancel-in-progress: false because cancelling
# a mid-flight publish would leave the npm registry inconsistent with
# the GitHub Release. Keyed on the resolved tag so a dispatch and a
# tag-push for the same version still serialize against each other.
concurrency:
  group: publish-${{ inputs.tag || github.ref_name }}
  cancel-in-progress: false

env:
  TAG: ${{ inputs.tag || github.ref_name }}
  RELEASE_URL: ${{ github.server_url }}/${{ github.repository }}/releases/tag/${{ inputs.tag || github.ref_name }}

permissions: {}

jobs:
  build:
    # Forks and renamed copies of this repository must never publish the package.
    if: github.repository == 'browserless/browserless-cli'
    runs-on: ubuntu-latest
    timeout-minutes: 20
    permissions:
      contents: read
    # The test suite runs here; never let it emit usage analytics.
    env:
      BROWSERLESS_TELEMETRY_DISABLED: '1'
    steps:
      # Force the tags namespace so a workflow_dispatch can only ever publish a real
      # release tag, never an arbitrary branch/SHA someone types into the input: a value
      # like `main` resolves to `refs/tags/main`, which does not exist, and checkout
      # fails before anything is built or published. On a tag-push, `github.ref_name` is
      # that same tag, so this is a no-op for the automatic path.
      - uses: actions/checkout@v7.0.1
        with:
          ref: refs/tags/${{ inputs.tag || github.ref_name }}
          # Nothing here pushes git, so don't leave the token in .git/config where a
          # build/test/dependency script could read it.
          persist-credentials: false

      # Belt-and-suspenders for the manual path: reject anything that is not a vX.Y.Z
      # release, and refuse to publish a tag whose checked-out tree declares a different
      # version — so a dispatch can only ship the exact release the tag names.
      - name: Validate release tag
        run: |
          if [[ ! "$TAG" =~ ^v[0-9]+\.[0-9]+\.[0-9]+$ ]]; then
            echo "::error::TAG '$TAG' is not a vX.Y.Z release tag"; exit 1
          fi
          pkg="$(node -p "require('./package.json').version")"
          if [[ "$TAG" != "v$pkg" ]]; then
            echo "::error::Tag '$TAG' does not match package.json version 'v$pkg'"; exit 1
          fi
          echo "Publishing $TAG (package.json $pkg)"

      - name: Set up Node 26
        uses: actions/setup-node@v7.1.0
        with:
          node-version-file: .nvmrc
          package-manager-cache: false
          check-latest: true
      - name: Ensure npm >= 11.10.0 (min-release-age support)
        run: |
          node -e 'const [major, minor] = process.argv[1].split(".").map(Number); if (!(major > 11 || (major === 11 && minor >= 10))) process.exit(1)' "$(npm --version)"

      - name: Install dependencies
        run: npm ci

      - name: Test
        run: npm test
        env:
          CI: 'true'

      # prepack builds the publish bundle without a publishing identity.
      - name: Pack npm package
        run: |
          mkdir -p "$RUNNER_TEMP/npm-package"
          npm pack --pack-destination "$RUNNER_TEMP/npm-package"
          mv "$RUNNER_TEMP/npm-package/"*.tgz "$RUNNER_TEMP/npm-package/package.tgz"
      - uses: actions/upload-artifact@v7.0.2
        with:
          name: npm-package
          path: ${{ runner.temp }}/npm-package/package.tgz
          if-no-files-found: error
          retention-days: 7

  publish:
    needs: build
    runs-on: ubuntu-slim
    timeout-minutes: 15
    # Protection rules live on the environment (repository settings): add
    # reviewers and limit deployments to release tags (`v*.*.*`) plus the
    # default branch — a recovery dispatch runs on the branch it was
    # dispatched from, and the rule checks that ref, not the `tag` input. If
    # npm's trusted publisher names an environment, it must be this one.
    environment: npm-publish
    permissions:
      contents: read
      id-token: write
    steps:
      # Only for scripts/ci/notify-slack.sh; the package comes from the build job.
      - uses: actions/checkout@v7.0.1
        with:
          ref: refs/tags/${{ inputs.tag || github.ref_name }}
          persist-credentials: false
      - uses: actions/setup-node@v7.1.0
        with:
          node-version-file: .nvmrc
          registry-url: https://registry.npmjs.org
          package-manager-cache: false
          check-latest: true
      - name: Ensure npm >= 11.10.0 (min-release-age support)
        # Use the bundled npm; never download another CLI with OIDC available.
        run: |
          node -e 'const [major, minor] = process.argv[1].split(".").map(Number); if (!(major > 11 || (major === 11 && minor >= 10))) process.exit(1)' "$(npm --version)"
      - uses: actions/download-artifact@v8.0.2
        with:
          name: npm-package
          path: ${{ runner.temp }}/npm-package
      # Publish only the same-run tarball; never execute package lifecycle scripts.
      # Tarball publishing omits gitHead; OIDC provenance records the source commit.
      - name: Publish to npm
        run: npm publish "$RUNNER_TEMP/npm-package/package.tgz" --access public --ignore-scripts

      # The package is already published by this point; a Slack hiccup must not
      # mark the release as failed.
      - name: Notify Slack
        if: success()
        continue-on-error: true
        run: bash scripts/ci/notify-slack.sh
        env:
          SLACK_WEBHOOK_URL: ${{ secrets.SLACK_RELEASES_WEBHOOK }}
